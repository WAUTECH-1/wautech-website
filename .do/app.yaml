name: wautech-website
region: fra
static_sites:
  - name: corporate
    environment_slug: node-js
    github:
      repo: WAUTECH-1/wautech-website
      branch: main
      deploy_on_push: false
    source_dir: /
    build_command: npm ci && npm run build
    output_dir: dist
    index_document: index.html
    error_document: 404.html
    envs:
      - key: SITE_URL
        value: https://wautechltd.com
        scope: BUILD_TIME
      - key: PUBLIC_INDEXING
        value: 'false'
        scope: BUILD_TIME
